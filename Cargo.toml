[package]
name = "stermusic"
version = "0.2.2"
edition = "2021"
description = "SterMusic — un lecteur de musique pour Linux"
license = "GPL-3.0-or-later"

[dependencies]
# GUI (same version as SterCode); SVG icons
eframe = { version = "0.31", features = ["persistence"] }
egui_extras = { version = "0.31", default-features = false, features = ["svg"] }
# Audio playback (decoding through Symphonia: MP3, FLAC, OGG/Vorbis, WAV, AAC/M4A)
rodio = { version = "0.21", default-features = false, features = ["playback", "symphonia-all"] }
# Reading tags and embedded album art
lofty = "0.22"
# Album art and Mica background
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "bmp", "gif"] }
# Desktop control (MPRIS): media keys, KDE / GNOME media player widget
souvlaki = { version = "0.8", default-features = false, features = ["use_zbus"] }
# Window position sent by a KWin script (Mica following the window), over D-Bus
zbus = "5"
# Dialogs (XDG portal, without GTK)
rfd = "0.15"
walkdir = "2"
fastrand = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Tag import from MusicBrainz and album art from the Cover Art Archive (HTTPS)
ureq = { version = "2", default-features = false, features = ["tls"] }
# Search and replace and file name patterns of the tag editor
regex = "1"
# File drag and drop under Wayland (winit 0.30 only handles it under X11): see `[patch]`.
smithay-clipboard = "0.7"
notify = { version = "8", default-features = false }
# Casting to a Chromecast (TLS connection for the Cast protocol); already used by ureq.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
# System tray icon (KDE StatusNotifierItem, over D-Bus).
ksni = { version = "0.3", default-features = false, features = ["blocking", "async-io"] }

# egui's Wayland clipboard, modified to accept files dragged onto the window (see
# vendor/smithay-clipboard/README.md).
[patch.crates-io]
smithay-clipboard = { path = "vendor/smithay-clipboard" }
# Tag reading, fixed for the album art of "unsynchronised" ID3v2.4 tags (see
# vendor/lofty/STERMUSIC.md).
lofty = { path = "vendor/lofty" }

[profile.release]
opt-level = 3
lto = "thin"
strip = true

# Audio and image decoding is slow without optimization, even in debug builds.
[profile.dev.package."*"]
opt-level = 2

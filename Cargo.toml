[package]
name = "stermusic"
version = "0.2.0"
edition = "2021"
description = "SterMusic — un lecteur de musique pour Linux"
license = "MIT"

[dependencies]
# Interface graphique (même version que SterCode) ; icônes SVG
eframe = { version = "0.31", features = ["persistence"] }
egui_extras = { version = "0.31", default-features = false, features = ["svg"] }
# Lecture audio (décodage via Symphonia : MP3, FLAC, OGG/Vorbis, WAV, AAC/M4A)
rodio = { version = "0.21", default-features = false, features = ["playback", "symphonia-all"] }
# Lecture des tags et des pochettes intégrées
lofty = "0.22"
# Pochettes et fond Mica
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "bmp", "gif"] }
# Contrôle depuis le bureau (MPRIS) : touches multimédia, widget lecteur de KDE / GNOME
souvlaki = { version = "0.8", default-features = false, features = ["use_zbus"] }
# Position de la fenêtre envoyée par un script KWin (Mica qui suit la fenêtre), sur D-Bus
zbus = "5"
# Boîtes de dialogue (portail XDG, sans GTK)
rfd = "0.15"
walkdir = "2"
fastrand = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Import des tags depuis MusicBrainz et des pochettes depuis le Cover Art Archive (HTTPS)
ureq = { version = "2", default-features = false, features = ["tls"] }
# Rechercher-remplacer et motifs de noms de fichiers de l'éditeur de tags
regex = "1"
# Glisser-déposer de fichiers sous Wayland (winit 0.30 ne le gère que sous X11) : voir `[patch]`.
smithay-clipboard = "0.7"

# Presse-papiers Wayland d'egui, modifié pour accepter les fichiers glissés sur la fenêtre (voir
# vendor/smithay-clipboard/README.md).
[patch.crates-io]
smithay-clipboard = { path = "vendor/smithay-clipboard" }

[profile.release]
opt-level = 3
lto = "thin"
strip = true

# Le décodage audio et des images est lent sans optimisation, même en debug.
[profile.dev.package."*"]
opt-level = 2
